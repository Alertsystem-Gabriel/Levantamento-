name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Estes valores identificam o projeto no navegador e são públicos por definição.
# A segurança dos dados permanece nas políticas RLS configuradas no Supabase.
env:
  VITE_SUPABASE_URL: https://azametabxezpuyxekiqq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Dn5f79FkgHdK5io081etsQ_l9xXNJxI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar o sistema
        run: pnpm build

      - name: Preparar a página inicial
        run: cp dist/app.html dist/index.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar os arquivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
